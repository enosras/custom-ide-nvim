set -g mouse on
# -----------------------------------------
# ENOS CONFIGS
#  --------------------------------------------
# I changed my leader to ` to type this symbol double type ``
unbind C-b
set -g prefix `
bind ` send-prefix
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"
# ==========================================
# TYPECRAFT TUTORIALS
# ============================================
unbind r
bind r source-file ~/.tmux.conf
setw -g mode-keys vi

# this is universal not from any of the masters but a rule of configs to source after variables
# ----------------------------------------
# DECLARATIVE PLUGINS
# -----------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @catppuccin_flavor 'frappe' # Options: latte, frappe, macchiato, mocha
set -g @catppuccin_window_status_style "rounded"
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
# set -agF status-right "#{E:@catppuccin_status_cpu}"
# set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_session}"
# set -ag status-right "#{E:@catppuccin_status_uptime}"
# set -agF status-right "#{E:@catppuccin_status_battery}"

# set -g @catppuccin_status_modules_right "weather application session"

# set -g @plugin 'dracula/tmux'
# set -g @dracula-show-powerline true
# set -g @dracula-fixed-location "Seattle"
# set -g @dracula-plugins "weather"
# set -g @dracula-show-flags true
# set -g @dracula-show-left-icon session
set -g status-position top
run '~/.tmux/plugins/tpm/tpm'
