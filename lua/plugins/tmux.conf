set -g mouse on
# -----------------------------------------
# ENOS CONFIGS
#  --------------------------------------------
# I changed my leader to ` to type this symbol double type ``
unbind C-b
set -g prefix `
bind ` send-prefix

set -g pane-border-status top # Displays titles on the top border of each pane
set -g pane-border-format " #P: #T " # Formats it as: [Pane Number: Pane Title]

# i changed ctrl-o to
# unbind C-o
# set -g prefix Space
# bind Space send-prefix
bind-key -n C-o rotate-window

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# uncomment this if not on catpuccin
# set -g default-terminal "screen-256color"
# set -as terminal-features ",xterm-256color:RGB"

# these setings eliminate background highlighting BCE
set -g default-terminal "tmux -256color"
set -as terminal-overrides ",xterm-256color:RGB"
# ==========================================
# TYPECRAFT TUTORIALS
# ============================================
unbind r
bind r source-file ~/.tmux.conf
# bind r send-prefix
setw -g mode-keys vi


# this is universal not from any of the masters but a rule of configs to source after variables
# ----------------------------------------
# DECLARATIVE PLUGINS
# -----------------------------------------
set -g @plugin 'tmux-plugins/tpm'


# NOTE Special variables before loading to the chunk
set-option -g @tmux-weather-format "%l:+%c+%t"
set -g @catppuccin_flavor 'macchiato' # Options: latte, frappe, macchiato, mocha
set -g @catppuccin_window_status_style "rounded"
set -g @tmux-fzf-options "-p -w 62% -h 38% --border=rounded --color=border:blue,label:yellow"


# Main Plugin Loading
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'xamut/tmux-weather'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'xamut/tmux-weather'
set -g @plugin 'sainnhe/tmux-fzf'

# NOTE Catpuccin configs
# set -g @catppuccin_flavor 'mocha' # Options: latte, frappe, macchiato, mocha
# set -g @catppuccin_window_status_style "rounded"
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
# set -agF status-right "#{E:@catppuccin_status_cpu}"
# set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_session}"
# set -ag status-right "#{E:@catppuccin_status_uptime}"
# set -agF status-right "#{E:@catppuccin_status_battery}"
# set -g @catppuccin_status_modules_right "weather application session"

# =============
# NOTE an addition for weather on the status bar
# set -g @forecast-location "Seattle"
# set -g @plugin 'xamut/tmux-weather'
# set-option -g @tmux-weather-format "%l:+%c+%t"

set-environment -g FZF_DEFAULT_OPTS "--border=rounded --margin=1 --padding=1 --color=border:blue,label:yellow"
# use the square brackets to embed the weather into the dominant background theme
set -ag status-right " #[fg=#a6adc8,bg=#313244] #{weather} "
# set -g @plugin 'dracula/tmux'
# set -g @dracula-show-powerline true
# set -ag @dracula-fixed-location "Seattle"
# set -ag @dracula-plugins "weather"
# set -g @dracula-show-flags true
# set -g @dracula-show-left-icon session

set -g status-position top
run '~/.tmux/plugins/tpm/tpm'
